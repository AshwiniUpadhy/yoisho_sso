[project]
name = "yoisho_sso"
authors = [{ name = "Yoisho", email = "dev@yoisho.in" }]
description = "Share the Frappe session across *.yoisho.in so one login at accounts.yoisho.in signs people into every Yoisho app"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "yoisho_sso"
